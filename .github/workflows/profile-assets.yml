name: Refresh profile visuals

on:
  workflow_dispatch:
  # TEMPORARY: lets the workflow run on the test branch (workflow_dispatch only
  # works for workflows already on the default branch). Remove before merging.
  push:
    branches: [naveenkarasu-patch-1]
  schedule:
    - cron: "17 4 * * *"

# NIGHTSHIFT-inspired hardening: read-only by default.
# Only the publish job receives repository write access.
permissions:
  contents: read

concurrency:
  group: profile-visuals
  cancel-in-progress: true

jobs:
  build:
    name: Build profile assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image dependency
        run: python -m pip install --upgrade pillow

      - name: Build static dark/light panels
        run: python scripts/build_static_assets.py

      - name: Build terminal portrait
        env:
          PROFILE_USERNAME: ${{ github.repository_owner }}
        run: python scripts/generate_ascii_profile.py

      - name: Build live stats and recent activity
        env:
          PROFILE_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_github_data.py

      - name: Generate 3D contribution calendars
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Generate contribution snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/contribution-snake-dark.svg?color_snake=#EC4899&color_dots=#07131D,#0E3A34,#0F766E,#00B87C,#00F5A0
            assets/contribution-snake-light.svg?color_snake=#BF3989&color_dots=#F6F8FA,#D8EEE7,#A7D7C5,#45A77F,#00875F

      - name: Package generated visuals
        uses: actions/upload-artifact@v4
        with:
          name: profile-visuals
          path: |
            assets/
            profile-3d-contrib/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish generated visuals
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download generated visuals
        uses: actions/download-artifact@v4
        with:
          name: profile-visuals
          path: .

      - name: Commit refreshed assets
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets profile-3d-contrib
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh profile visuals"
          git push
